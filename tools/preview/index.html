<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon Radar preview</title>
<!-- Visual reference for the firmware: draws the radar from shared/radar.json and plays
     shared/sounds.json with WebAudio. The JSON blocks at the bottom are embedded by
     tools/preview/build.mjs; edit the shared files, not these blocks.
     URL parameters (used by tools/preview/render.mjs for the PNG stills):
       shot=1      render one frozen frame, canvas only
       zoom=N      zoom level index            heading=DEG   simulated gyro heading
       theme=NAME  palette from radar.json     b=0..1        blink brightness of the dots
       boot=MS     time since power-on (renders the boot animation at that moment)
       zfrom=N&zp=0..1  zoom transition from level N to zoom, at progress zp
       label=MS    time since the last zoom change (scale label), default: hidden
       sweep=MODE  scan effect (radar.json sweep.modes)   st=MS  clock of the sweep hand
       ring=MS     time since the last beep (the sweep ring)
       selftest=1  run the live state machine on a synthetic clock (see selftest()) -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0d0b; color: #cfd8cc;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; align-items: center; justify-content: center; }
  main { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 32px; }
  /* Casing: the white disc with the knob on top (HTML decoration only; the panel shows the screen). */
  #device { position: relative; width: 530px; height: 530px; border-radius: 50%; padding: 32px;
            background: radial-gradient(circle at 35% 30%, #fbfbf7, #d9dbd3 60%, #a9aca2);
            box-shadow: 0 18px 40px #000a, inset 0 -6px 12px #0003; margin-top: 46px; }
  #knob { position: absolute; left: 50%; top: -46px; width: 74px; height: 58px; transform: translateX(-50%);
          border: 0; border-radius: 14px 14px 6px 6px; cursor: pointer; padding: 0;
          background: repeating-linear-gradient(90deg, #8d9088 0 4px, #c9cbc3 4px 8px); box-shadow: 0 4px 8px #0006; }
  #knob:active { transform: translateX(-50%) translateY(4px); }
  #radar { display: block; width: 466px; height: 466px; border-radius: 50%; clip-path: circle(50%); background: #000; }
  #panel { width: 300px; display: grid; gap: 14px; }
  h1 { font-size: 17px; margin: 0; color: #e9f3e4; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #1d2a1d; color: #dbeed4; border: 1px solid #355335; border-radius: 6px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #26392a; }
  label { display: grid; gap: 4px; }
  input[type=range], select { width: 100%; }
  select { background: #1d2a1d; color: #dbeed4; border: 1px solid #355335; border-radius: 6px; padding: 5px; font: inherit; }
  #readout { font: 12px/1.6 ui-monospace, Menlo, monospace; background: #121812; border: 1px solid #243424; border-radius: 6px; padding: 8px 10px; white-space: pre; }
  .keys { font-size: 12px; color: #8fa08a; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid #3a4a3a; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  body.shot { display: block; background: #000; }
  body.shot main { display: block; padding: 0; }
  body.shot #device { width: auto; height: auto; padding: 0; margin: 0; background: none; box-shadow: none; border-radius: 0; }
  body.shot #knob, body.shot #panel { display: none; }
  body.shot #radar { border-radius: 0; clip-path: none; }
</style>
</head>
<body>
<main>
  <div id="device">
    <button id="knob" title="BOOT (top button): zoom out (Space)" aria-label="BOOT: zoom out"></button>
    <canvas id="radar" width="466" height="466"></canvas>
  </div>
  <section id="panel">
    <h1>Dragon Radar preview</h1>
    <div class="row" title="The board's buttons, as on the device; every press plays the button sound">
      <button id="bBoot" title="BOOT click: zoom out">BOOT</button>
      <button id="bBootHold" title="BOOT hold: info card">BOOT hold</button>
      <button id="bKey2" title="KEY2 click: zoom in">KEY2</button>
      <button id="bKey2Hold" title="KEY2 hold: power off/on">KEY2 hold</button>
      <button id="bReplay" title="Replay the boot animation (no press)">Replay boot</button>
    </div>
    <div class="row" id="sfx" title="Play a sound of shared/sounds.json"></div>
    <label>Heading (gyro) <span id="headingVal">0°</span>
      <input id="heading" type="range" min="0" max="359" value="0"></label>
    <label>Walk towards the balls: distances × <span id="distVal">1</span>
      <input id="dist" type="range" min="-200" max="100" value="0"></label>
    <label>Volume <span id="volVal">60</span>
      <input id="vol" type="range" min="0" max="100" value="60"></label>
    <label>Theme <select id="theme"></select></label>
    <label>Barrido <select id="sweep"></select></label>
    <div id="readout"></div>
    <div class="keys">Screen: tap zoom out · swipe ←/→ theme · long press heading reset.
      <kbd>Space</kbd>/<kbd>↑</kbd> BOOT · <kbd>↓</kbd> KEY2 · <kbd>P</kbd> KEY2 hold (power) · <kbd>I</kbd> BOOT hold (info) ·
      <kbd>T</kbd> swipe (theme) · <kbd>H</kbd> long press (heading) · <kbd>←</kbd><kbd>→</kbd> gyro · <kbd>B</kbd> replay boot ·
      <kbd>S</kbd> barrido · <kbd>M</kbd> mute. Sound starts after the first click or key.</div>
  </section>
</main>

<script id="radar-json" type="application/json">
{"comment":"Single source of truth for the radar look and behaviour, shared by the firmware (tools/gen_radar.mjs emits firmware/dragonradar/radar_assets.h) and the web preview (tools/preview/build.mjs embeds it). Lengths are fractions of the screen radius R (R = 233 px on the 466x466 panel), so every renderer draws the same picture at any size. Times are in milliseconds, colours are #RRGGBB. Screen coordinates: origin at the centre, x to the right, y down, bearings clockwise from north. See docs/design.md for the sources and the reasoning behind each value.","version":1,"refSizePx":466,"theme":"z","themes":{"z":{"label":"Dragon Ball Z (Namek)","background":"#000000","screen":"#0c8a12","screenCenter":"#18a020","screenEdge":"#04620a","rim":"#012603","grid":"#004800","ballCore":"#fffbe5","ballDim":"#c9c98a","ballGlow":"#ecef88","marker":"#e80d07","markerEdge":"#5a0402","digits":"#fffeac","arrow":"#e80d07","text":"#d8f8c0","ping":"#b8f0a0","sheen":"#ffffff","counts":"stars","sweep":"#b8f0a0"},"classic":{"label":"Dragon Ball (1986)","background":"#000000","screen":"#587048","screenCenter":"#627a50","screenEdge":"#3c5030","rim":"#1a2414","grid":"#829c75","ballCore":"#fde46e","ballDim":"#b89a50","ballGlow":"#e89848","marker":"#e80d07","markerEdge":"#5a0402","digits":"#fde46e","arrow":"#e89848","text":"#e8f0d8","ping":"#c8d8b0","sheen":"#ffffff","counts":"stars","sweep":"#e8f0d8"},"ptp":{"label":"The Path to Power (1996)","background":"#000000","screen":"#00a878","screenCenter":"#10b888","screenEdge":"#007a55","rim":"#00301f","grid":"#006a4a","ballCore":"#fff4d0","ballDim":"#c0b090","ballGlow":"#f0d070","marker":"#e02020","markerEdge":"#500808","digits":"#fff4a0","arrow":"#e83030","text":"#d0fff0","ping":"#a0f0d0","sheen":"#ffffff","counts":"stars","sweep":"#a0f0d0"}},"shading":{"comment":"Screen fill: radial gradient screenCenter (at 0) -> screen (at midStop) -> screenEdge (at 1). A dark rim (theme.rim) of rimWidthR fades in towards the edge, where the green glass meets the casing. The sheen is a faint ellipse of glass reflection, upper left, as in the GT stills.","midStop":0.55,"rimWidthR":0.035,"sheen":{"enabled":true,"cxR":-0.32,"cyR":-0.48,"rxR":0.52,"ryR":0.26,"angleDeg":-28,"alpha":0.07}},"grid":{"comment":"Square graticule fixed to the screen (it does not rotate with the heading, as in the anime). The centre of the screen sits in the middle of a cell (offsetCells 0.5), as in the Namek frames: about 9 cells across.","offsetCells":0.5,"rotateWithHeading":false},"zoom":{"comment":"The top button zooms out one level (the anime: each press shows more of the planet) and wraps from the widest back to the closest; the bottom one zooms in and wraps from the closest to the widest. The grid pitch stays the same on screen; what changes is the real distance per cell. View radius = cellM / pitchR.","default":1,"wrap":true,"levels":[{"cellM":10,"pitchR":0.222,"lineWidthR":0.014,"label":"10 m"},{"cellM":100,"pitchR":0.222,"lineWidthR":0.014,"label":"100 m"},{"cellM":1000,"pitchR":0.222,"lineWidthR":0.014,"label":"1 km"},{"cellM":10000,"pitchR":0.222,"lineWidthR":0.014,"label":"10 km"}]},"marker":{"comment":"The user: a red isosceles triangle with its centroid on the screen centre, apex pointing up (the heading, since the map is heading-up).","heightR":0.11,"baseR":0.12,"edgeR":0.008},"ball":{"comment":"counts (per theme): stars = every dot carries the star number of its ball (1-7, unique); a group shows the stars of its nearest ball, next to its rightmost sphere; none = no digits. Dots closer than mergeR on screen form a group at their centroid, drawn as a little cluster of as many spheres as balls (as in the anime): 2 side by side, 3-6 on a ring (point up when odd, flat top when even), 7 a ring of six around one, with clusterSpacingR between neighbouring centres. Glow alpha at distance d from the centre: glowAlpha * b * (1 - d / glowR)^glowFalloff, where b is the blink brightness (dimLevel..1). The core is a solid disc coloured mix(ballDim, ballCore, b).","coreR":0.055,"glowR":0.14,"glowAlpha":0.9,"glowFalloff":1.3,"visibleR":0.9,"mergeR":0.12,"clusterSpacingR":0.11,"digitHeightR":0.075,"digitStrokeR":0.013,"digitDxR":0.075,"digitDyR":-0.035},"arrow":{"comment":"Balls beyond visibleR are shown as a triangle on the edge, pointing outwards along their bearing (the wiki: the radar 'points arrows in the directions of nearby Dragon Balls'; drawn like the red edge marks of The Path to Power). Same blink as the balls. Arrows less than mergeDeg apart are drawn once.","radiusR":0.89,"lengthR":0.065,"widthR":0.07,"mergeDeg":6},"blink":{"comment":"All dots flash together on every radar beep: brightness rises to 1 in riseMs, then decays exponentially (time constant decayMs) towards dimLevel. With the beep off (muted or no ball) they pulse every periodMs.","syncToBeep":true,"riseMs":30,"decayMs":380,"dimLevel":0.35,"periodMs":1000},"scaleLabel":{"comment":"Adaptation (not in the anime): after a zoom change the cell size shows for a moment under the marker, drawn with the stroke font.","enabled":true,"showMs":1200,"fadeMs":400,"yR":0.6,"heightR":0.07,"strokeR":0.011},"transitions":{"zoom":{"comment":"On a zoom change the old grid scales by the zoom ratio while fading out, the new one fades in, and the dots slide (log-interpolated scale) to their new positions.","durationMs":280,"easing":"easeOutCubic"},"powerOff":{"comment":"Dots go first, then the whole screen fades to AMOLED black.","durationMs":450,"ballsOutMs":120,"sfx":"power_off"}},"boot":{"comment":"Power-on timeline from black. screen: fades in with two dim flickers; grid: lines revealed from the centre outwards; marker: blinks in; ping: one ring expands to the edge (adaptation, a single first scan, not a rotating sweep); balls: fade in, then the beep starts. The power_on sound starts at 0 and its two pips land on markerFromMs and pingFromMs.","durationMs":1500,"sfx":"power_on","screenFromMs":0,"screenToMs":240,"flickerAtMs":[70,150],"flickerMs":35,"flickerLevel":0.25,"gridFromMs":240,"gridToMs":700,"markerFromMs":700,"markerToMs":940,"markerBlinks":2,"pingFromMs":940,"pingToMs":1240,"pingWidthR":0.03,"ballsFromMs":1240,"ballsToMs":1500},"sweep":{"comment":"Scan effect, chosen by the user against the strict reading of the sources. mode: line = a hand that turns clockwise once every periodMs with a fading trail of trailDeg behind it (theme.sweep colour); dots flash as the hand crosses them when dotFlash is on. ring = a ring that grows from the centre to maxR over durationMs on every radar beep (syncToBeep). both = line and ring; none = no scan, only the beep blink. The preview offers the four so the user can pick one; mode is the default.","enabled":true,"mode":"line","modes":["line","ring","both","none"],"line":{"periodMs":2400,"trailDeg":75,"alpha":0.55,"trailAlpha":0.28,"lineWidthR":0.012,"dotFlash":true},"ring":{"syncToBeep":true,"durationMs":520,"widthR":0.025,"alpha":0.6,"maxR":1}},"font":{"comment":"Stroke font for the cluster counts and the scale label. Each glyph is a list of polylines on a 4 x 6 box (x right, y down); advance is the horizontal step per glyph, both in box units.","boxW":4,"boxH":6,"advance":5.6,"glyphs":{"0":[[[0,0],[4,0],[4,6],[0,6],[0,0]]],"1":[[[0.8,1.2],[2.2,0],[2.2,6]],[[0.8,6],[3.6,6]]],"2":[[[0,0],[4,0],[4,3],[0,3],[0,6],[4,6]]],"3":[[[0,0],[4,0],[4,6],[0,6]],[[1,3],[4,3]]],"4":[[[3,6],[3,0],[0,4],[4,4]]],"5":[[[4,0],[0,0],[0,3],[4,3],[4,6],[0,6]]],"6":[[[4,0],[0,0],[0,6],[4,6],[4,3],[0,3]]],"7":[[[0,0],[4,0],[1.4,6]]],"8":[[[0,0],[4,0],[4,6],[0,6],[0,0]],[[0,3],[4,3]]],"9":[[[4,3],[0,3],[0,0],[4,0],[4,6],[0,6]]],"k":[[[0,0],[0,6]],[[3.6,2.4],[0,4.6]],[[1.3,3.8],[3.8,6]]],"m":[[[0,6],[0,2.4],[4,2.4],[4,6]],[[2,2.4],[2,6]]]," ":[]}},"demo":{"comment":"Seven sample balls for the preview and a firmware demo mode: bearing in degrees clockwise from north, distance in metres. Chosen so every zoom level shows something: at 10 m only ball 1 is on screen and the rest are edge arrows; at 100 m balls 1-3 show as separate dots; at 1 km balls 1-3 merge into a 3 and balls 5-6 into a 2; at 10 km balls 1-6 merge into a 6 at the centre and ball 7 appears.","balls":[{"stars":1,"bearingDeg":40,"distanceM":25},{"stars":2,"bearingDeg":300,"distanceM":180},{"stars":3,"bearingDeg":310,"distanceM":210},{"stars":4,"bearingDeg":120,"distanceM":900},{"stars":5,"bearingDeg":200,"distanceM":3200},{"stars":6,"bearingDeg":197,"distanceM":3300},{"stars":7,"bearingDeg":75,"distanceM":28000}]}}

<script id="sounds-json" type="application/json">
{"comment":"Sound catalogue of the radar. firmware/dragonradar/sounds.h is generated from this by the common tools/gen_sounds.mjs (each entry: name, tempo, notes in the melody format of sound.h: raw HZ:MS tones and R:MS rests, ~square / ~sine / ~tri switches the waveform of the tones that follow). gain (0-100, percent of the user volume) and the beep block are read by tools/gen_radar.mjs (radar_assets.h), the preview and tools/preview/render_wav.mjs; the other fields are documentation. Matched to a measured clip of the anime's radar (pitch, harmonics and timing only; the clip is not in the repo): each beep is a 'pi-PI', about 80 ms at 2130 Hz then 60 ms an octave up at 4260 Hz, close to a triangle wave (3rd harmonic about 0.13); power on opens with a 2100 +- 100 Hz warble. See docs/design.md.","synth":{"comment":"How every renderer plays a tone (matches the ES8311 synth of sound.cpp): square (naive), sine, or a band-limited triangle (its odd harmonics up to 0.45 x sampleRate, amplitude 1/k^2), at sampleRate. Amplitude ramps over rampMs at each change. Level of full scale at user volume v (0-100, after the effect's gain: v = volume x gain / 100): levelAt100 x 10^(-rangeDb x (1 - v/100)^curveShape / 20), and 0 at v = 0; with these values volume 60 is -3.6 dB, 30 is -16 dB and 10 is -28 dB. Raw HZ:MS tones are legato (no gap between them).","sampleRate":48000,"rampMs":2,"levelAt100":0.95,"rangeDb":36,"curveShape":2.5},"beep":{"comment":"The radar beep repeats while at least one ball is known. Its interval depends on the distance d (metres) of the nearest ball, on a log scale: t = clamp((log10(farM) - log10(d)) / (log10(farM) - log10(nearM)), 0, 1); interval = maxIntervalMs + (minIntervalMs - maxIntervalMs) x t^curvePow. The distance is absolute, so zooming does not change the rhythm. The dots flash on every beep (radar.json blink). Crossing closeM plays ball_close once and crossing foundM plays ball_found once; each re-arms when the distance grows past threshold x rearmFactor.","sfx":"radar_beep","nearM":3,"farM":10000,"minIntervalMs":160,"maxIntervalMs":1400,"curvePow":1,"closeM":30,"closeSfx":"ball_close","foundM":3,"foundSfx":"ball_found","rearmFactor":1.3},"sfx":[{"name":"power_on","tempo":120,"gain":80,"notes":"~tri 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 R:364 2130:80 4260:60 R:100 2130:80 4260:60","es":"Encendido: tono que tiembla mientras se enciende la pantalla y dos \"pi-PI\" con el marcador y la onda","en":"Power on: a warbling tone while the screen lights up and two \"pi-PI\" with the marker and the scan ring"},{"name":"radar_beep","tempo":120,"gain":100,"notes":"~tri 2130:80 4260:60","es":"El \"pi-PI\" del radar: dos tonos a una octava; se repite más rápido cuanto más cerca está la esfera","en":"The radar \"pi-PI\": two tones an octave apart; repeats faster the closer the nearest ball is"},{"name":"zoom_out","tempo":120,"gain":75,"notes":"~tri 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 R:20 4260:40","es":"Botón de arriba: el \"brrr\" del botón y un blip agudo al alejar la escala","en":"Top button: the button \"brrr\" and a high blip when zooming out"},{"name":"button","tempo":120,"gain":80,"notes":"~tri 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12","es":"Pulsar un botón o la pantalla: el \"brrr\" que tiembla entre 2000 y 2200 Hz del clip del anime, antes del pitido","en":"Any button or screen press: the \"brrr\" warbling between 2000 and 2200 Hz in the anime clip, before the beep"},{"name":"zoom_in","tempo":120,"gain":75,"notes":"~tri 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 2000:12 2200:12 R:20 2130:40","es":"Acercar la escala: el mismo \"brrr\" con un blip más grave","en":"Zoom in: the same \"brrr\" with a lower blip"},{"name":"ball_close","tempo":120,"gain":80,"notes":"~tri 2130:40 4260:30 R:30 2130:40 4260:30 R:30 2130:40 4260:30","es":"Una esfera entra a menos de 30 m: tres \"pi-PI\" rápidos","en":"A ball comes within 30 m: three quick \"pi-PI\""},{"name":"ball_found","tempo":120,"gain":85,"notes":"~tri 1568:70 R:15 2093:70 R:15 2637:70 R:15 3136:120 4260:120","es":"Esfera encontrada (a menos de 3 m): cuatro notas que suben y un pip final","en":"Ball found (within 3 m): four rising notes and a final pip"},{"name":"power_off","tempo":120,"gain":75,"notes":"~tri 2200:20 2000:20 1800:20 1600:20 1400:20 1250:20 1100:20 950:25 800:25 650:30 500:40","es":"Apagado: barrido que baja mientras se apaga la pantalla","en":"Power off: a falling sweep while the screen goes dark"}]}

<script>
'use strict';
const RADAR = JSON.parse(document.getElementById('radar-json').textContent);
const SOUNDS = JSON.parse(document.getElementById('sounds-json').textContent);
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');
if (SHOT) document.body.classList.add('shot');

// >>> renderer (tools/preview/renderer.js, embedded by tools/preview/build.mjs)
// Radar renderer shared by the preview (tools/preview/index.html) and the board's web panel
// (web/index.html). tools/preview/build.mjs copies this file verbatim between the renderer markers
// of both pages; edit it here, then run the build. Plain browser script, no modules, so both pages
// keep working from file://. It draws one frame from a view and keeps no state between frames.
//
// createRadarRenderer(canvas, RADAR) -> { draw(view), scaleOf(zoom), blinkLevel(msSinceBeep),
//                                         pointToBall(px, py, view), viewRadiusM(zoom) }
// view = {
//   theme, zoom, heading,                    // palette name, level index, degrees (map is heading-up)
//   balls: [{ stars, bearingDeg, distanceM }],
//   blink,                                   // dot brightness dimLevel..1 (blinkLevel())
//   zoomFrom, zoomP,                         // transition from level zoomFrom at progress 0..1 (or null)
//   bootT, offT,                             // ms since power-on / power-off, or null
//   labelAge,                                // ms since the last zoom change (scale label), or null
//   sweep, sweepT, ringAge,                  // scan mode (radar.json sweep.modes), ms clock of the hand,
//                                            //   ms since the last beep (the ring); mode defaults to none
//   off,                                     // the screen is dark
// }
function createRadarRenderer(canvas, RADAR) {
  'use strict';
  const ctx = canvas.getContext('2d');
  const W = canvas.width, CX = W / 2, CY = W / 2, R = W / 2;
  const LEVELS = RADAR.zoom.levels;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const ramp = (t, a, b) => (b > a ? clamp01((t - a) / (b - a)) : t >= b ? 1 : 0);
  const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);
  const rad = (d) => (d * Math.PI) / 180;
  // Digit modes of theme.counts: stars = the star number of the dot's (nearest) ball; none = no digits.
  const COUNT_MODES = ['stars', 'none'];
  let P = RADAR.themes[RADAR.theme];

  function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgba(h, a = 1) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
  function mix(h1, h2, t) {
    const a = hexRgb(h1), b = hexRgb(h2);
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  }

  const scaleOf = (i) => LEVELS[i].pitchR / LEVELS[i].cellM;  // R units per metre
  const viewRadiusM = (i) => LEVELS[i].cellM / LEVELS[i].pitchR;

  // Dot brightness e ms after a beep: rise to 1, then exponential decay to dimLevel.
  function blinkLevel(e) {
    const k = RADAR.blink;
    if (e < 0) return k.dimLevel;
    if (e < k.riseMs) return k.dimLevel + (1 - k.dimLevel) * (e / k.riseMs);
    return k.dimLevel + (1 - k.dimLevel) * Math.exp(-(e - k.riseMs) / k.decayMs);
  }

  // Brightness of a dot e ms after the sweep hand crossed it: same rise and decay, no floor.
  function flashLevel(e) {
    const k = RADAR.blink;
    if (e < 0) return 0;
    return e < k.riseMs ? e / k.riseMs : Math.exp(-(e - k.riseMs) / k.decayMs);
  }

  // Screen positions (R units) at a scale; dots closer than mergeR merge, near arrows are drawn once.
  // Balls go nearest first, so a merged dot keeps the stars of its nearest ball.
  function layout(balls, heading, scale) {
    const B = RADAR.ball, dots = [], arrows = [];
    const diff = (a, b) => Math.abs(((a - b + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
    for (const b of [...balls].sort((a, c) => a.distanceM - c.distanceM)) {
      const rel = rad(b.bearingDeg - heading), r = b.distanceM * scale;
      if (r > B.visibleR) {
        if (!arrows.some((a) => diff(a, rel) < rad(RADAR.arrow.mergeDeg))) arrows.push(rel);
        continue;
      }
      const x = Math.sin(rel) * r, y = -Math.cos(rel) * r;
      const near = dots.find((c) => Math.hypot(c.x - x, c.y - y) < B.mergeR);
      if (near) { near.x = (near.x * near.n + x) / (near.n + 1); near.y = (near.y * near.n + y) / (near.n + 1); near.n++; }
      else dots.push({ x, y, n: 1, stars: b.stars });

  let beepDuringPress = false;
  for (let t = 0; t <= 3200; t += 10) {
    if (t === 1700) INPUT.swipeLeft(t);
    if (t === 2000) INPUT.bootClick(t);
    if (t === 2400) INPUT.key2Hold(t);
    const before = S.lastBeep;
    step(t);
    if (S.lastBeep !== before && t < S.pressUntil) beepDuringPress = true;
  }
  document.title = `selftest power=${S.power} zoom=${S.zoom} theme=${S.theme} beepDuringPress=${beepDuringPress}`;
}

function fmtM(m) { return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' km' : Math.round(m) + ' m'; }
let lastReadout = '';
function readout(d, iv) {
  const L = LEVELS[S.zoom], txt =
    `zoom      ${S.zoom + 1}/${LEVELS.length}  ${L.label} per cell\n` +
    `view      radius ${fmtM(L.cellM / L.pitchR)}\n` +
    `nearest   ${fmtM(d)}\n` +
    `beep      every ${iv} ms${S.muted ? ' (muted)' : ''}\n` +
    `heading   ${S.heading}°` +
    (performance.now() - (S.infoAt ?? -1e9) < 3000 ? '\ninfo      card shown on the device' : '');
  if (txt !== lastReadout) document.getElementById('readout').textContent = lastReadout = txt;
}

// ------------------------------------------------------------------ start
if (SHOT) {
  const bootT = Q.has('boot') ? +Q.get('boot') : null;
  S.blinkAt = -1e9;
  frame(0, bootT, null);
  document.title = 'ready';
} else {
  const sel = document.getElementById('theme');
  for (const [k, t] of Object.entries(RADAR.themes)) sel.add(new Option(t.label, k, false, k === S.theme));
  sel.onchange = () => { S.theme = sel.value; };
  const SWEEP_LABELS = { line: 'aguja', ring: 'onda', both: 'las dos', none: 'ninguno' };
  const sw = document.getElementById('sweep');
  for (const m of RADAR.sweep.modes) sw.add(new Option(SWEEP_LABELS[m] || m, m, false, m === S.sweep));
  sw.onchange = () => { S.sweep = sw.value; };
  const hd = document.getElementById('heading');
  setHeading = (v) => { S.heading = ((Math.round(v) % 360) + 360) % 360; hd.value = S.heading; document.getElementById('headingVal').textContent = S.heading + '°'; };
  syncControls = () => { sel.value = S.theme; };
  const SFX_LABELS = { power_on: 'encender', radar_beep: 'pitido', zoom_out: 'alejar', button: 'botón', zoom_in: 'acercar', ball_close: 'cerca', ball_found: 'encontrada', power_off: 'apagar' };
  for (const x of SOUNDS.sfx) {
    const b = document.createElement('button');
    b.textContent = SFX_LABELS[x.name] || x.name;
    b.title = x.en || x.name;
    b.onclick = () => { audio(); playSfx(x.name); };
    document.getElementById('sfx').append(b);
  }
  hd.oninput = () => setHeading(+hd.value);
  const ds = document.getElementById('dist');
  ds.oninput = () => { S.distScale = Math.pow(10, ds.value / 100); document.getElementById('distVal').textContent = S.distScale.toPrecision(2); };
  const vl = document.getElementById('vol');
  vl.oninput = () => { S.volume = +vl.value; document.getElementById('volVal').textContent = vl.value; };
  const first = () => { audio(); };
  document.addEventListener('pointerdown', first, { capture: true });
  const now = () => performance.now();
  document.getElementById('knob').onclick = () => INPUT.bootClick(now());
  document.getElementById('bBoot').onclick = () => INPUT.bootClick(now());
  document.getElementById('bBootHold').onclick = () => INPUT.bootHold(now());
  document.getElementById('bKey2').onclick = () => INPUT.key2Click(now());
  document.getElementById('bKey2Hold').onclick = () => INPUT.key2Hold(now());
  document.getElementById('bReplay').onclick = () => { audio(); boot(); };
  // Touch on the screen: tap, swipe left/right (40 px or more, mostly horizontal), long press (600 ms).
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: now() }; });
  canvas.addEventListener('pointerup', (e) => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y, held = now() - down.t;
    down = null;
    if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? INPUT.swipeLeft : INPUT.swipeRight)(now());
    else if (held >= 600) INPUT.longPress(now());
    else INPUT.tap(now());
  });
  document.addEventListener('keydown', (e) => {
    audio();
    if (e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if (e.repeat) return;
    if (k === ' ' || k === 'arrowup') { e.preventDefault(); INPUT.bootClick(now()); }
    else if (k === 'arrowdown') { e.preventDefault(); INPUT.key2Click(now()); }
    else if (k === 'arrowleft') setHeading(S.heading - 5);
    else if (k === 'arrowright') setHeading(S.heading + 5);
    else if (k === 'p') INPUT.key2Hold(now());
    else if (k === 'i') INPUT.bootHold(now());
    else if (k === 'h') INPUT.longPress(now());
    else if (k === 'b') boot();
    else if (k === 'm') S.muted = !S.muted;
    else if (k === 's') { const ms = RADAR.sweep.modes; S.sweep = ms[(ms.indexOf(S.sweep) + 1) % ms.length]; sw.value = S.sweep; }
    else if (k === 't') INPUT.swipeLeft(now());
  });
  if (Q.has('selftest')) selftest();
  else { boot(); requestAnimationFrame(tick); }
}
</script>
</body>
