<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Dragon Radar</title>
<style>
  :root { --bg: #050806; --fg: #e6efe8; --dim: #8a9a8e; --accent: #2bd66b; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f7f4; --fg: #102014; --dim: #55655a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; padding: 2rem; }
  h1 { margin: 0 0 .25rem; color: var(--accent); }
  p { color: var(--dim); }
  pre { background: rgba(127, 127, 127, .12); padding: 1rem; border-radius: 8px; overflow: auto; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Dragon Radar</h1>
  <p>The control panel is on its way. Live state of the board:</p>
  <pre id="state">loading...</pre>
  <p><a href="https://adrianmb.dev" style="color: inherit">adrianmb.dev</a></p>
</main>
<script>
  // ?host=<board IP> points the page at a board while developing it from disk.
  const host = new URLSearchParams(location.search).get('host');
  const base = host ? `http://${host}` : '';
  const out = document.getElementById('state');
  async function poll() {
    try {
      const r = await fetch(`${base}/api/state`, { cache: 'no-store' });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) {
      out.textContent = `no answer from the board (${e.message})`;
    }
  }
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
